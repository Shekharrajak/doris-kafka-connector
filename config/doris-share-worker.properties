name=doris_share_sink
topics=events
tasks.max=3
consumer.bootstrap.servers=localhost:9092
consumer.group.id=doris-events-share
consumer.max.poll.records=64
doris.share.group.enabled=true
delivery.guarantee=at_least_once
doris.urls=localhost
doris.http.port=8030
doris.query.port=9030
doris.database=demo
doris.topic2table.map=events:events
doris.user=root
doris.password=
sink.properties.format=json
sink.properties.read_json_by_line=true
sink.properties.strict_mode=true
sink.properties.max_filter_ratio=0
